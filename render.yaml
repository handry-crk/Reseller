services:
  - type: web
    name: crk-reseller-hub
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@crk.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: TZ
        value: Asia/Jakarta
